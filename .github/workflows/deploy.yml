name: Deploy Proshop App to Azure VM

on:
  push:
    branches:
      - new-demo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/proshop-v2
            git pull origin new-demo

            cd backend
            npm install

            cd ../frontend
            npm install

            pm2 restart backend
            pm2 restart frontend
